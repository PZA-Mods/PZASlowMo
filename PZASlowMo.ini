; PZA's SlowMo - settings. Author: PZA.
[PZASlowMo]
Enabled=1
; v1.0: text language. auto = Kenshi's own language (English, Russian, Chinese, Japanese; others show English). en|ru|zh|ja to choose; ru/zh/ja need Kenshi itself in that language (its fonts carry the letters).
Language=auto
; Slow-motion speed (the slider and - / + change it and save it here).
Speed=0.50
; Slider range and step. With 0.05 steps the slider lands exactly on 0.10, 0.15 ... 0.50 ... 0.60.
MinSpeed=0.10
MaxSpeed=0.60
SliderStep=0.05
; Toggle key. Shift+L (L is the one letter free in Kenshi, Direct Control and our mods). Ignored while typing.
Hotkey=Shift+L
; 1 = show the small "Slow motion" window (drag it by its title). 0 = hotkey only.
ShowWindow=1
; Where the window opens, as a fraction of the screen (0..1). -1 = next to Kenshi's speed buttons.
WindowX=-1
WindowY=-1
; 1 = an on-screen message when slow motion turns on or off.
Popups=1
; v0.2.0: HideWithUI=1 hides the window when F7 hides Kenshi's interface; Collapsed = window size: 0 full, 2 tiny (one small speed button + "+", no frame); "-" makes it tiny, "+" opens it again
HideWithUI=1
Collapsed=0
; v0.2.4: where the tiny button sits (fractions of the screen; -1 = top-right corner). Drag the tiny button to move it: saved here.
TinyX=-1
TinyY=-1
; v0.2.5: tiny button opacity, 0.35 (faint) .. 1 (solid). Mouse wheel over the tiny button changes it; saved here.
TinyAlpha=1.0
